[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "precision-mlps"
version = "0.1.0"
description = "Machine-precision MLP training via quasi-interpolant theory"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "mpmath>=1.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "wandb>=0.28.0",
    "dash>=4.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]
jax-experiments = ["jax>=0.4.35", "optax>=0.2.3"]
# MPFR oracle for the p-bit arithmetic tests (tests/test_pbit.py); src/precision itself needs only a C compiler.
# pfloat (p-bit arrays and reference LAPACK at p bits) is the arithmetic of expC13.
precision = ["gmpy2>=2.3", "pfloat>=0.1.0"]

[tool.setuptools.packages.find]
include = ["src*", "experiments*"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/_archive --ignore=experiments/_archive"
markers = [
    "slow: marks tests that take >10s (mpmath construction). Deselect with -m 'not slow'.",
]

# pfloat is developed next door (github.com/samlayton99/pfloat); use the local checkout until it is on PyPI
[tool.uv.sources]
pfloat = { path = "../../../projects/tools/pfloat", editable = true }
